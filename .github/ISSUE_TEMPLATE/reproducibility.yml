name: Reproducibility report
description: Report a command, artifact or documented claim that cannot be reproduced.
title: "[Reproduction] "
body:
  - type: markdown
    attributes:
      value: "Share the smallest reproducible case. Do not upload secrets, restricted data or unapproved hardware details."
  - type: input
    id: revision
    attributes:
      label: Revision
      description: "Commit SHA or release and the affected document or artifact."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and prerequisites
      description: "OS, runtime versions, working directory, installation steps and unavailable dependencies."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact reproduction
      description: "Commands and the smallest non-sensitive input needed to reproduce the issue."
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: "Include exit status and relevant output. Link the documented expectation."
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence category
      options:
        - Documentation or repository tooling
        - Synthetic or simulated case
        - Physical measurement
        - External source or unavailable input
    validations:
      required: true
